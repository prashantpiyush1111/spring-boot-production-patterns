name: CI - Build All Patterns

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-circuit-breaker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Circuit Breaker
        run: mvn clean install -f 01-circuit-breaker/circuit-breaker/pom.xml

  build-rate-limiting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Rate Limiting
        run: mvn clean install -f 02-rate-limiting/rate-limiting/pom.xml

  build-retry-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Retry Logic
        run: mvn clean install -f 03-retry-logic/retry-logic/pom.xml

  build-idempotency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Idempotency
        run: mvn clean install -f 04-idempotency/pom.xml

  build-caching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Caching
        run: mvn clean install -f 05-caching/pom.xml

  build-bulkhead:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Bulkhead
        run: mvn clean install -f 06-bulkhead/pom.xml

build-health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Health Check
        run: mvn clean install -f 07-health-check/pom.xml